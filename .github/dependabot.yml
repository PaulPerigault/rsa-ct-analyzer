version: 2
# `cooldown`: a version must be 7 days old before it is proposed (a compromised
# release is usually pulled in that time). Security updates do not wait.
# Patch and minor updates are auto-merged by dependabot-automerge.yml once `ci`
# is green; majors stay as separate PRs for review.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    commit-message: {prefix: 'chore(deps)'}
    labels: [dependencies]
  - package-ecosystem: gomod
    directory: /tools
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    commit-message: {prefix: 'chore(deps-dev)'}
    labels: [dependencies]
    groups:
      dev-tools:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    commit-message: {prefix: 'ci'}
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    commit-message: {prefix: 'chore(deps)'}
    labels: [dependencies]
